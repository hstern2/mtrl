[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtrl"
version = "0.1.0"
description = "AMSR molecular generation and reinforcement learning"
authors = [{ name = "Harry Stern" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<3",
    "trl @ git+https://github.com/hstern2/trl.git@5e8b1278a9e513db56fa4f34fa22b79d3f9963da",
    "amsr @ git+https://github.com/hstern2/amsr.git@86fd7004947946012efd907496038327477c8ce6",
    "lad @ git+https://github.com/OrogenTX/lad.git@e15343efcdddf9a9b7fb3e025cf30ea3df1a7a23 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "rdkit",
    "matplotlib>=3.8",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "pre-commit>=4",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
mtrl = "mtrl.cli:app"

[tool.setuptools]
packages = { find = { include = ["mtrl", "mtrl.*"] } }

[tool.setuptools.package-data]
mtrl = ["data/*.pkl.gz"]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
lint.select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["mtrl"]

[tool.mypy]
python_version = "3.11"
packages = ["mtrl"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires GPU"]
